name: Institutional Trading Bot CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Core & Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 bandit mypy
        pip install -r requirements.txt

    - name: Repository-Wide Code Quality & Syntax Check
      run: |
        flake8 . --exclude=.venv,.git,__pycache__ --count --select=E9,F63,F7,F821 --show-source --statistics
      continue-on-error: false

    - name: Static Type Checking (mypy)
      run: |
        mypy --ignore-missing-imports . || true
      continue-on-error: true

    - name: Security Scanning (bandit)
      run: |
        bandit -r . -x ./.venv,./tests -ll || true
      continue-on-error: true

    - name: Run Full Pytest Test Suite
      run: |
        mkdir -p junit
        pytest tests/ --junitxml=junit/test-results.xml -v
      continue-on-error: false


  smoke-test-and-deploy:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Deploy & Smoke Test with Automatic Rollback (AWS Singapore)
      env:
        SSH_KEY: ${{ secrets.AWS_SINGAPORE_KEY }}
        AWS_HOST: 47.129.153.199
      run: |
        if [ -z "$SSH_KEY" ]; then
          echo "AWS_SINGAPORE_KEY secret not configured — skipping deploy."
          exit 0
        fi
        echo "$SSH_KEY" > /tmp/deploy_key.pem
        chmod 600 /tmp/deploy_key.pem

        ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem ubuntu@$AWS_HOST 'bash -s' << 'EOF'
          set -e
          cd ~/btc-trading-bot
          PREV_SHA=$(git rev-parse HEAD)
          echo "[Deploy] Pre-deploy commit SHA: $PREV_SHA"

          # 1. Pull new code & update virtual environment dependencies
          git pull origin main
          .venv/bin/pip install -r requirements.txt --quiet || true

          # 2. Restart trading service
          sudo systemctl restart trading-bot

          # 3. Readiness Gate & Health Smoke Test (15s polling loop)
          HEALTHY=0
          for i in {1..15}; do
            sleep 2
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/api/status || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "[Deploy Success] /api/status returned HTTP 200 after check ${i}."
              HEALTHY=1
              break
            fi
          done

          # 4. Automatic Rollback on smoke test failure
          if [ $HEALTHY -eq 0 ]; then
            echo "❌ [DEPLOY FAILED] /api/status health check failed. Triggering Automatic Rollback to $PREV_SHA..."
            git reset --hard "$PREV_SHA"
            sudo systemctl restart trading-bot
            echo "⚠️ [Rollback Complete] System restored to working commit $PREV_SHA."
            exit 1
          fi
        EOF
      continue-on-error: false
