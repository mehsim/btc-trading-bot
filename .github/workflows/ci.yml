name: Institutional Trading Bot CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 bandit numpy pandas scipy scikit-learn

    - name: Code Quality & Linting (New Modules Only)
      run: |
        flake8 statistical_validation.py exit_policy_engine.py portfolio_risk.py \
               order_executor.py transaction_cost_model.py audit_trail_logger.py \
               champion_challenger_framework.py order_flow_analyzer.py \
               portfolio_optimizer.py execution_simulator.py shap_explainer.py \
               walk_forward_engine.py \
               --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: false

    - name: Security Scanning
      run: |
        bandit -r . -x ./.venv,./tests -l
      continue-on-error: true

    - name: Run Pytest (Core Tests Only)
      run: |
        mkdir -p junit
        pytest tests/test_today_metrics.py --junitxml=junit/test-results.xml -v
      continue-on-error: true



  smoke-test-and-deploy:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Deploy to AWS Singapore
      env:
        SSH_KEY: ${{ secrets.AWS_SINGAPORE_KEY }}
        AWS_HOST: 47.129.153.199
      run: |
        echo "$SSH_KEY" > /tmp/deploy_key.pem
        chmod 600 /tmp/deploy_key.pem
        ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem ubuntu@$AWS_HOST \
          "cd ~/btc-trading-bot && git pull origin main && pkill -f main.py 2>/dev/null; nohup .venv/bin/python3 main.py > bot.log 2>&1 </dev/null &"

    - name: Smoke Test — Health Check
      env:
        AWS_HOST: 47.129.153.199
      run: |
        sleep 8
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$AWS_HOST:5001/api/status)
        if [ "$STATUS" != "200" ]; then
          echo "SMOKE TEST FAILED: /api/status returned $STATUS. Triggering rollback."
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key.pem ubuntu@$AWS_HOST \
            "cd ~/btc-trading-bot && git revert HEAD --no-edit && git push origin main && nohup .venv/bin/python3 main.py > bot.log 2>&1 </dev/null &"
          exit 1
        fi
        echo "Smoke test passed: HTTP $STATUS"

